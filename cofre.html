<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cofre de Senhas</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Colors & tokens inspired by your dashboard -->
  <style>
    :root{
      --ink:#0B1020; --muted:#5b6b86; --border:#e6ebf5;
      --bg:#f6f8fc; --card:#ffffff; --ring:rgba(31,165,76,.28);
      --rs-green:#1FA54C; --rs-yellow:#FFC107; --rs-red:#C62828;
      --primary:#5b6bff;
    }
    html,body{background:var(--bg); color:var(--ink);}
    .card{border:1px solid var(--border); box-shadow:0 10px 30px rgba(11,16,32,.06)}
    .subtle{color:var(--muted)}
    .badge-soft{background:#eef2ff; color:#3b479e; border:1px solid #e6ebf5}
    .border-soft{border-color:var(--border)!important}
    .rounded-12{border-radius:12px}
    .rounded-16{border-radius:16px}
    .btn-primary{background:var(--primary); border-color:#5360e6}
    .btn-outline-primary{border-color:#cfd7ff; color:#3942b6}
    .btn-outline-primary:hover{background:#eef2ff}
    .form-control, .form-select{border-color:var(--border)}
    .form-control:focus, .form-select:focus{box-shadow:0 0 0 .2rem rgba(91,107,255,.15); border-color:#b8c1ff}
    .list-hover .list-group-item:hover{background:#f2f5ff}
    .shadow-soft{box-shadow:0 10px 30px rgba(11,16,32,.08)}
    .icon-btn{display:inline-flex; align-items:center; gap:.5rem}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}
    .truncate{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .table > :not(caption) > * > *{vertical-align:middle}
    .tag{display:inline-flex;align-items:center;gap:.35rem;background:#f7f9ff;border:1px solid var(--border);padding:.25rem .5rem;border-radius:999px;font-size:.75rem;color:#40517a}
    .sticky-toolbar{position:sticky; top:0; z-index:10; background:rgba(255,255,255,.85); backdrop-filter:saturate(180%) blur(8px);}
    .toast-container{z-index: 1080;}
  </style>
</head>
<body>

<header class="sticky-toolbar py-3 border-bottom border-soft">
  <div class="container-xxl d-flex align-items-center gap-3">
    <div class="d-flex align-items-center gap-2">
      <div class="d-inline-grid place-items-center bg-dark text-white rounded-3 fw-bold" style="width:36px;height:36px">KV</div>
      <div>
        <div class="fw-semibold">Cofre de Senhas</div>
        <div class="small subtle">UI/UX alinhado ao dashboard, com Bootstrap</div>
      </div>
    </div>
    <div class="ms-auto d-flex flex-wrap gap-2">
      <div class="input-group">
        <span class="input-group-text bg-white border-soft"><i class="bi bi-search subtle"></i></span>
        <input id="q" class="form-control" placeholder="Buscar por nome, login, URL, tags, notas…">
      </div>
      <select id="filterTag" class="form-select" style="min-width: 180px">
        <option value="">Todas as tags</option>
      </select>
      <select id="sortBy" class="form-select">
        <option value="recent">Mais recentes</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
        <option value="fav">Favoritos primeiro</option>
      </select>
      <div class="form-check d-flex align-items-center ms-2">
        <input id="onlyFav" class="form-check-input" type="checkbox">
        <label class="form-check-label ms-2 small subtle" for="onlyFav">Favoritos</label>
      </div>
      <button id="btnExport" class="btn btn-outline-primary icon-btn"><i class="bi bi-download"></i> Exportar</button>
      <label for="importFile" class="btn btn-outline-primary icon-btn m-0"><i class="bi bi-upload"></i> Importar</label>
      <input id="importFile" type="file" accept="application/json" hidden>
      <button id="btnAdd" class="btn btn-primary icon-btn"><i class="bi bi-plus-lg"></i> Nova</button>
    </div>
  </div>
</header>

<main class="container-xxl my-4">
  <div class="row g-3">
    <!-- Lista (esquerda) -->
    <div class="col-12 col-lg-4">
      <div class="card rounded-16">
        <div class="card-header bg-white rounded-top-16 border-soft">
          <div class="d-flex align-items-center justify-content-between">
            <div class="fw-semibold">Credenciais</div>
            <span id="countBadge" class="badge text-bg-light border border-soft">0 itens</span>
          </div>
        </div>
        <div class="list-group list-hover list-group-flush" id="list"></div>
      </div>
    </div>

    <!-- Detalhes (direita) -->
    <div class="col-12 col-lg-8">
      <div class="card rounded-16">
        <div class="card-body" id="emptyState">
          <div class="text-center py-5">
            <i class="bi bi-shield-lock" style="font-size:2.2rem"></i>
            <h6 class="mt-3 mb-1">Nenhuma entrada selecionada</h6>
            <p class="subtle mb-0">Selecione um item da lista ou crie uma nova credencial.</p>
          </div>
        </div>

        <div class="card-body d-none" id="detail">
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2 flex-wrap">
              <span id="d_host" class="badge badge-soft"></span>
              <h5 id="d_name" class="mb-0"></h5>
            </div>
            <div class="d-flex gap-2">
              <button id="d_edit" class="btn btn-outline-primary btn-sm icon-btn"><i class="bi bi-pencil-square"></i> Editar</button>
              <button id="d_dup" class="btn btn-outline-primary btn-sm icon-btn"><i class="bi bi-files"></i> Duplicar</button>
              <button id="d_del" class="btn btn-danger btn-sm icon-btn"><i class="bi bi-trash3"></i> Remover</button>
            </div>
          </div>

          <hr class="my-3">

          <div class="row gy-3">
            <div class="col-12 col-md-6">
              <div class="subtle small">Usuário / Email</div>
              <div id="d_user" class="fw-semibold mono"></div>
            </div>
            <div class="col-12 col-md-6">
              <div class="subtle small">Favorito</div>
              <button id="d_fav" class="btn btn-sm btn-outline-primary">☆</button>
            </div>
            <div class="col-12">
              <div class="subtle small mb-1">Senha</div>
              <div class="input-group">
                <input id="d_pass" class="form-control mono" type="password">
                <button id="d_toggle" class="btn btn-outline-primary"><i class="bi bi-eye"></i></button>
                <button id="d_copy" class="btn btn-outline-primary"><i class="bi bi-clipboard"></i> Copiar</button>
              </div>
            </div>
            <div class="col-12">
              <div class="subtle small mb-1">URL</div>
              <div class="d-flex gap-2">
                <a id="d_url" class="form-control mono truncate pe-2" href="#" target="_blank" rel="noopener"></a>
                <button id="d_open" class="btn btn-outline-primary"><i class="bi bi-box-arrow-up-right"></i></button>
              </div>
            </div>
            <div class="col-12">
              <div class="subtle small">Tags</div>
              <div id="d_tags" class="d-flex flex-wrap gap-2"></div>
            </div>
            <div class="col-12">
              <div class="subtle small">Notas</div>
              <div id="d_notes"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Modal Add/Edit -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content rounded-16">
      <div class="modal-header">
        <h6 class="modal-title" id="m_title">Nova credencial</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <form class="row g-3">
          <div class="col-12 col-md-7">
            <label class="form-label">Nome</label>
            <input id="m_name" type="text" class="form-control" placeholder="Ex.: Instagram — Gabinete X">
          </div>
          <div class="col-12 col-md-5">
            <label class="form-label">Usuário / Email</label>
            <input id="m_user" type="text" class="form-control" placeholder="usuario@exemplo.gov.br">
          </div>
          <div class="col-12 col-md-7">
            <label class="form-label">Senha</label>
            <div class="input-group">
              <input id="m_pass" type="password" class="form-control mono" placeholder="••••••••">
              <button id="m_toggle" type="button" class="btn btn-outline-primary"><i class="bi bi-eye"></i></button>
              <button id="m_gen" type="button" class="btn btn-outline-primary"><i class="bi bi-magic"></i> Gerar</button>
            </div>
          </div>
          <div class="col-12 col-md-5">
            <label class="form-label">URL</label>
            <input id="m_url" type="text" class="form-control" placeholder="https://...">
          </div>
          <div class="col-12 col-md-7">
            <label class="form-label">Tags (separe por vírgula)</label>
            <input id="m_tags" type="text" class="form-control" placeholder="Meta, Comunicação, Oficial">
          </div>
          <div class="col-12 col-md-5">
            <label class="form-label">Notas</label>
            <input id="m_notes" type="text" class="form-control" placeholder="Responsável, certificado, etc.">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="m_delete" type="button" class="btn btn-danger d-none"><i class="bi bi-trash3"></i> Remover</button>
        <button id="m_save" type="button" class="btn btn-primary"><i class="bi bi-save"></i> Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- Toasts -->
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
  <div id="toast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">Copiado!</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Storage (demo). Em produção: criptografia WebCrypto + PBKDF2/AES-GCM.
const STORAGE = 'vault-bs-v1';
const $ = (s, el=document)=>el.querySelector(s);
const $$ = (s, el=document)=>Array.from(el.querySelectorAll(s));
const uid = ()=> Math.random().toString(36).slice(2,9)+Date.now().toString(36);

let items = [];
let selectedId = null;

function seed(){
  return [
    {id:uid(), fav:true, name:'Instagram — SECOM RS', user:'midias@secom.rs.gov.br', pass:'R$-Gov2025!@',
     url:'https://instagram.com/governo_rs', tags:['Meta','Oficial'], notes:'Perfil institucional verificado', createdAt:Date.now()},
    {id:uid(), fav:false, name:'YouTube — SES RS', user:'video@saude.rs.gov.br', pass:'S@ude#2025',
     url:'https://youtube.com/@sauders', tags:['YouTube','Saúde'], notes:'2FA via app', createdAt:Date.now()-86000},
    {id:uid(), fav:false, name:'X/Twitter — SSP RS', user:'comunicacao@ssp.rs.gov.br', pass:'RS_SSP_!2024',
     url:'https://x.com/ssprs', tags:['X','Segurança'], notes:'Responsável: Carla', createdAt:Date.now()-172000}
  ];
}
function load(){
  try{ items = JSON.parse(localStorage.getItem(STORAGE)) || seed(); }
  catch{ items = seed(); }
}
function save(){ localStorage.setItem(STORAGE, JSON.stringify(items)); }

function hostFrom(url){
  try{ return new URL(url).hostname; }catch{ return '—'; }
}

// Render list
function renderList(){
  const list = $('#list');
  list.innerHTML='';

  const query = $('#q').value.toLowerCase();
  const tag = $('#filterTag').value;
  const onlyFav = $('#onlyFav').checked;
  const sortBy = $('#sortBy').value;

  // options tags
  const allTags = Array.from(new Set(items.flatMap(i=>i.tags||[]))).sort();
  const filterEl = $('#filterTag');
  const prev = filterEl.value;
  filterEl.innerHTML = '<option value=\"\">Todas as tags</option>' + allTags.map(t=>`<option ${t===prev?'selected':''} value=\"${t}\">${t}</option>`).join('');

  let listData = items.slice().filter(i=>{
    if(onlyFav && !i.fav) return false;
    if(tag && !(i.tags||[]).includes(tag)) return false;
    const hay = [i.name,i.user,i.url,i.notes,(i.tags||[]).join(' ')].join(' ').toLowerCase();
    return hay.includes(query);
  });

  listData.sort((a,b)=>{
    if(sortBy==='recent') return (b.createdAt||0)-(a.createdAt||0);
    if(sortBy==='az') return a.name.localeCompare(b.name,'pt');
    if(sortBy==='za') return b.name.localeCompare(a.name,'pt');
    if(sortBy==='fav') return (b.fav?1:0)-(a.fav?1:0);
    return 0;
  });

  $('#countBadge').textContent = listData.length + (listData.length===1?' item':' itens');

  listData.forEach(i=>{
    const a = document.createElement('button');
    a.type='button';
    a.className = 'list-group-item list-group-item-action d-flex align-items-center gap-2 py-3';
    a.innerHTML = `
      <button class="btn btn-sm ${i.fav?'btn-warning':'btn-outline-secondary'} me-1" data-star="${i.id}" title="Favorito">${i.fav?'★':'☆'}</button>
      <div class="flex-grow-1 text-start">
        <div class="fw-semibold truncate">${i.name}</div>
        <div class="small subtle">${hostFrom(i.url)}</div>
      </div>
      <button class="btn btn-sm btn-outline-secondary" data-open="${i.id}" title="Abrir URL"><i class="bi bi-box-arrow-up-right"></i></button>
      <button class="btn btn-sm btn-outline-secondary" data-copy="${i.id}" title="Copiar senha"><i class="bi bi-clipboard"></i></button>
      <button class="btn btn-sm btn-outline-secondary" data-edit="${i.id}" title="Editar"><i class="bi bi-pencil"></i></button>
    `;
    a.addEventListener('click',(e)=>{
      if(e.target.closest('[data-star],[data-open],[data-copy],[data-edit]')) return;
      selectItem(i.id);
    });
    list.appendChild(a);
  });
}

// Render detail
function renderDetail(){
  const it = items.find(i=>i.id===selectedId);
  if(!it){
    $('#emptyState').classList.remove('d-none');
    $('#detail').classList.add('d-none');
    return;
  }
  $('#emptyState').classList.add('d-none');
  $('#detail').classList.remove('d-none');

  $('#d_host').textContent = hostFrom(it.url);
  $('#d_name').textContent = it.name || '—';
  $('#d_user').textContent = it.user || '—';
  const pass = $('#d_pass'); pass.value = it.pass || ''; pass.type='password';
  const urlA = $('#d_url'); urlA.textContent = it.url || '—'; urlA.href = it.url || '#';
  const tags = $('#d_tags'); tags.innerHTML = (it.tags||[]).map(t=>`<span class="tag">${t}</span>`).join(' ');
  $('#d_notes').textContent = it.notes || '—';
  $('#d_fav').textContent = it.fav ? '★' : '☆';
}

function selectItem(id){
  selectedId = id;
  renderList(); // to refresh stars/active feel
  renderDetail();
}

function toast(msg){
  const el = $('#toast');
  el.querySelector('.toast-body').textContent = msg || 'Ok';
  const t = bootstrap.Toast.getOrCreateInstance(el);
  t.show();
}

// List actions
$('#list').addEventListener('click', (e)=>{
  const star = e.target.closest('[data-star]');
  const open = e.target.closest('[data-open]');
  const copy = e.target.closest('[data-copy]');
  const edit = e.target.closest('[data-edit]');
  if(star){
    const id = star.getAttribute('data-star');
    const it = items.find(i=>i.id===id); if(it){ it.fav = !it.fav; save(); renderList(); renderDetail(); }
  }
  if(open){
    const it = items.find(i=>i.id===open.getAttribute('data-open'));
    if(it && it.url) window.open(it.url,'_blank','noopener');
  }
  if(copy){
    const it = items.find(i=>i.id===copy.getAttribute('data-copy'));
    if(it){ navigator.clipboard.writeText(it.pass||''); toast('Senha copiada'); }
  }
  if(edit){
    openModal(edit.getAttribute('data-edit'));
  }
});

// Detail actions
$('#d_toggle').addEventListener('click', ()=>{
  const inp = $('#d_pass'); const masked = inp.type==='password';
  inp.type = masked ? 'text':'password';
  $('#d_toggle').innerHTML = masked ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
});
$('#d_copy').addEventListener('click', ()=>{
  navigator.clipboard.writeText($('#d_pass').value); toast('Senha copiada');
});
$('#d_open').addEventListener('click', ()=>{
  const it = items.find(i=>i.id===selectedId);
  if(it && it.url) window.open(it.url,'_blank','noopener');
});
$('#d_fav').addEventListener('click', ()=>{
  const it = items.find(i=>i.id===selectedId); if(!it) return;
  it.fav = !it.fav; save(); renderList(); renderDetail();
});
$('#d_edit').addEventListener('click', ()=> openModal(selectedId));
$('#d_dup').addEventListener('click', ()=>{
  const it = items.find(i=>i.id===selectedId); if(!it) return;
  const clone = {...it, id:uid(), name: it.name+' (cópia)', createdAt: Date.now()};
  items.unshift(clone); save(); renderList();
});
$('#d_del').addEventListener('click', ()=>{
  const it = items.find(i=>i.id===selectedId); if(!it) return;
  if(confirm(`Remover "${it.name}"?`)){
    items = items.filter(j=>j.id!==it.id); selectedId=null; save(); renderList(); renderDetail();
  }
});

// Toolbar
$('#q').addEventListener('input', ()=>{ renderList(); renderDetail(); });
$('#filterTag').addEventListener('change', ()=>{ renderList(); renderDetail(); });
$('#onlyFav').addEventListener('change', ()=>{ renderList(); renderDetail(); });
$('#sortBy').addEventListener('change', ()=>{ renderList(); renderDetail(); });

$('#btnExport').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(items,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='cofre_export.json';
  document.body.appendChild(a); a.click(); a.remove();
});
$('#importFile').addEventListener('change', (e)=>{
  const f = e.target.files?.[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(Array.isArray(data)){
        items = data.map(d=>({...d, id:d.id||uid(), createdAt: d.createdAt||Date.now()}));
        save(); renderList(); renderDetail();
      }else alert('JSON inválido.');
    }catch{ alert('Falha ao importar.'); }
  };
  r.readAsText(f);
});

// Modal
const modal = new bootstrap.Modal('#editModal');
$('#btnAdd').addEventListener('click', ()=> openModal(null));

function openModal(editId){
  $('#m_delete').classList.toggle('d-none', !editId);
  $('#m_title').textContent = editId ? 'Editar credencial' : 'Nova credencial';

  const it = items.find(i=>i.id===editId) || {name:'',user:'',pass:'',url:'',tags:[],notes:''};
  $('#m_name').value = it.name||'';
  $('#m_user').value = it.user||'';
  $('#m_pass').value = it.pass||'';
  $('#m_url').value  = it.url||'';
  $('#m_tags').value = (it.tags||[]).join(', ');
  $('#m_notes').value= it.notes||'';

  $('#m_save').onclick = ()=>{
    const data = {
      name: $('#m_name').value.trim(),
      user: $('#m_user').value.trim(),
      pass: $('#m_pass').value,
      url:  $('#m_url').value.trim(),
      tags: $('#m_tags').value.split(',').map(s=>s.trim()).filter(Boolean),
      notes: $('#m_notes').value.trim(),
    };
    if(!data.name){ alert('Informe um nome.'); return; }
    if(editId){
      const idx = items.findIndex(i=>i.id===editId);
      if(idx>=0) items[idx] = {...items[idx], ...data};
      selectedId = editId;
    }else{
      const rec = {id:uid(), createdAt:Date.now(), fav:false, ...data};
      items.unshift(rec); selectedId = rec.id;
    }
    save(); modal.hide(); renderList(); renderDetail();
  };

  $('#m_delete').onclick = ()=>{
    if(editId){
      const it = items.find(i=>i.id===editId);
      if(it && confirm(`Remover "${it.name}"?`)){
        items = items.filter(i=>i.id!==editId);
        save(); modal.hide(); selectedId=null; renderList(); renderDetail();
      }
    }
  };

  $('#m_toggle').onclick = ()=>{
    const inp = $('#m_pass'); const masked = inp.type==='password';
    inp.type = masked ? 'text' : 'password';
    $('#m_toggle').innerHTML = masked ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
  };
  $('#m_gen').onclick = ()=>{
    const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+[]{};:,.?/';
    const len=16; let out=''; const arr = new Uint32Array(len); crypto.getRandomValues(arr);
    for(let i=0;i<len;i++){ out += chars[arr[i]%chars.length]; }
    $('#m_pass').value = out;
  };

  modal.show();
}

// Init
load(); renderList(); renderDetail();
</script>

</body>
</html>
